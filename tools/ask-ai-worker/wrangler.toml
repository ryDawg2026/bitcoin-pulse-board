# pulse-ask-ai — NOT DEPLOYED. Separate from the kalshi-relay Worker. Deploy steps: see DEPLOY.md.
name = "pulse-ask-ai"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[ai]
binding = "AI"                      # Workers AI: no API key; billed in neurons against the account's free 10,000/day

[[ratelimits]]
name = "IP_LIMITER"                 # per-IP burst limit
namespace_id = "7301"               # any integer unique within the account
  [ratelimits.simple]
  limit = 5
  period = 60

[[durable_objects.bindings]]
name = "LIMITER"                    # daily caps (SQLite-backed, allowed on the Workers Free plan)
class_name = "AskLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AskLimiter"]

[vars]
# MODEL = "@cf/openai/gpt-oss-120b"
# FALLBACK_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# DAILY_CAP = "50"
# IP_DAILY_CAP = "15"
# ENABLED = "false"   # kill switch
