# TEMPLATE — copy to .github/workflows/kalshi-snapshot.yml (needs a token with `workflow` scope or the GitHub web UI to add it).
# Writes kalshi-snapshot.json (public, read-only Kalshi KXBTC15M data, no secrets) every ~5 min so the Pulse Board's Kalshi panel works on github.io.
name: kalshi-snapshot
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: kalshi-snapshot
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/kalshi_snapshot.py kalshi-snapshot.json
      - run: |
          git config user.name "kalshi-snapshot-bot"; git config user.email "actions@users.noreply.github.com"
          git add kalshi-snapshot.json
          git diff --cached --quiet || (git commit -m "kalshi snapshot" && git push)
